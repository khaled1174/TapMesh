<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title desc">
<title id="title">TapMesh connection architecture</title><desc id="desc">A coding agent connects over MCP stdio to TapMesh on a Mac. The local coordinator and device service connect to iPhone, iPad and iOS simulators. The native Mac interface shares those services.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52d6d3" stroke-width="1.4"/></marker></defs>
<rect width="1280" height="600" rx="24" fill="#0c1726"/>
<g fill="none" stroke="#1e3046" stroke-width="1"><path d="M0 120H1280M0 240H1280M0 360H1280M0 480H1280"/></g>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
<text x="54" y="66" fill="#52d6d3" font-size="14" font-weight="700" letter-spacing="3">LOCAL DEVICE WORKSPACE · MCP</text>
<text x="52" y="130" fill="#f6f9fc" font-size="54" font-weight="700">TapMesh</text>
<text x="54" y="169" fill="#b6c9dd" font-size="23">Your project. Your agent. Your Apple devices.</text>
<rect x="342" y="220" width="574" height="310" rx="20" fill="#112338" stroke="#344b65"/>
<text x="366" y="252" fill="#b6c9dd" font-size="13" letter-spacing="2">ON YOUR MAC</text>
<rect x="54" y="285" width="230" height="140" rx="13" fill="#172d44" stroke="#3f5b76"/><text x="74" y="317" fill="#f6f9fc" font-size="20" font-weight="600">Coding agent</text><text x="74" y="345" fill="#b6c9dd" font-size="15" font-weight="400">Your existing project</text><text x="74" y="368" fill="#b6c9dd" font-size="15" font-weight="400">MCP-capable client</text><rect x="366" y="285" width="242" height="140" rx="13" fill="#172d44" stroke="#3f5b76"/><text x="386" y="317" fill="#f6f9fc" font-size="20" font-weight="600">tapmesh-mcp</text><text x="386" y="345" fill="#b6c9dd" font-size="15" font-weight="400">stdio launcher</text><text x="386" y="368" fill="#b6c9dd" font-size="15" font-weight="400">Private local connection</text><rect x="655" y="285" width="236" height="140" rx="13" fill="#172d44" stroke="#3f5b76"/><text x="675" y="317" fill="#f6f9fc" font-size="20" font-weight="600">Local services</text><text x="675" y="345" fill="#b6c9dd" font-size="15" font-weight="400">Coordinator + device I/O</text><text x="675" y="368" fill="#b6c9dd" font-size="15" font-weight="400">Xcode builds and inspection</text><rect x="966" y="285" width="260" height="140" rx="13" fill="#172d44" stroke="#3f5b76"/><text x="986" y="317" fill="#f6f9fc" font-size="20" font-weight="600">Apple devices</text><text x="986" y="345" fill="#b6c9dd" font-size="15" font-weight="400">iPhone · iPad</text><text x="986" y="368" fill="#b6c9dd" font-size="15" font-weight="400">iOS simulator</text><path d="M284 351H357" fill="none" stroke="#52d6d3" stroke-width="2" marker-end="url(#arrow)"/><text x="289" y="329" fill="#52d6d3" font-size="13" font-weight="400">stdio</text><path d="M608 351H646" fill="none" stroke="#52d6d3" stroke-width="2" marker-end="url(#arrow)"/><path d="M891 351H957" fill="none" stroke="#52d6d3" stroke-width="2" marker-end="url(#arrow)"/><text x="926" y="329" fill="#52d6d3" font-size="13" font-weight="400">local</text><text x="371" y="478" fill="#f6f9fc" font-size="18" font-weight="600">Native Mac interface</text><text x="371" y="503" fill="#b6c9dd" font-size="15" font-weight="400">Preview · Approvals · Stop / Resume</text><path d="M776 465V435" fill="none" stroke="#52d6d3" stroke-width="2" marker-end="url(#arrow)"/><text x="54" y="569" fill="#52d6d3" font-size="12" font-weight="600">CONNECTION DIAGRAM</text><text x="318" y="569" fill="#b6c9dd" font-size="16" font-weight="400">No SDK in your app  /  No fixed port to copy  /  Device and build approvals stay with you</text></g></svg>
