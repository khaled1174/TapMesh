<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc"><title id="title">TapMesh development loop</title><desc id="desc">Connect MCP, select an authorized device, build and run the project, then observe and independently verify the application result. Feed verified findings back into the project.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52d6d3" stroke-width="1.4"/></marker></defs><rect width="1280" height="440" rx="24" fill="#0c1726"/><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif"><text x="52" y="58" fill="#52d6d3" font-size="14" font-weight="700">THE DEVELOPMENT LOOP</text><text x="52" y="104" fill="#f6f9fc" font-size="38" font-weight="700">Observe. Act. Verify.</text><rect x="52" y="164" width="267" height="142" rx="13" fill="#172d44" stroke="#3f5b76"/><text x="72" y="196" fill="#f6f9fc" font-size="20" font-weight="600">Connect</text><text x="72" y="224" fill="#b6c9dd" font-size="15" font-weight="400">Copy MCP settings</text><text x="72" y="247" fill="#b6c9dd" font-size="15" font-weight="400">from the Mac app</text><text x="271" y="196" fill="#52d6d3" font-size="14" font-weight="600">01</text><rect x="355" y="164" width="267" height="142" rx="13" fill="#172d44" stroke="#3f5b76"/><text x="375" y="196" fill="#f6f9fc" font-size="20" font-weight="600">Select</text><text x="375" y="224" fill="#b6c9dd" font-size="15" font-weight="400">Inspect readiness</text><text x="375" y="247" fill="#b6c9dd" font-size="15" font-weight="400">Choose your device</text><text x="574" y="196" fill="#52d6d3" font-size="14" font-weight="600">02</text><rect x="658" y="164" width="267" height="142" rx="13" fill="#172d44" stroke="#3f5b76"/><text x="678" y="196" fill="#f6f9fc" font-size="20" font-weight="600">Build + run</text><text x="678" y="224" fill="#b6c9dd" font-size="15" font-weight="400">Allow the project folder</text><text x="678" y="247" fill="#b6c9dd" font-size="15" font-weight="400">Approve the exact build</text><text x="877" y="196" fill="#52d6d3" font-size="14" font-weight="600">03</text><rect x="961" y="164" width="267" height="142" rx="13" fill="#172d44" stroke="#3f5b76"/><text x="981" y="196" fill="#f6f9fc" font-size="20" font-weight="600">Verify</text><text x="981" y="224" fill="#b6c9dd" font-size="15" font-weight="400">Observe the current app</text><text x="981" y="247" fill="#b6c9dd" font-size="15" font-weight="400">Read the result independently</text><text x="1180" y="196" fill="#52d6d3" font-size="14" font-weight="600">04</text><path d="M319 235H345" fill="none" stroke="#52d6d3" stroke-width="2" marker-end="url(#arrow)"/><path d="M622 235H648" fill="none" stroke="#52d6d3" stroke-width="2" marker-end="url(#arrow)"/><path d="M925 235H951" fill="none" stroke="#52d6d3" stroke-width="2" marker-end="url(#arrow)"/><path d="M1094 320V350H185V316" fill="none" stroke="#52d6d3" stroke-width="2" marker-end="url(#arrow)"/><text x="405" y="379" fill="#b6c9dd" font-size="18" font-weight="400">Use verified findings to guide the next change.</text><text x="52" y="415" fill="#8ea7c1" font-size="15" font-weight="400">Command delivery is not proof of success. Required approvals remain part of the workflow.</text></g></svg>
