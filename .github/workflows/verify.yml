name: Verify TapMesh
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra test
      - run: uv run --no-sync python scripts/check_contracts.py
      - run: uv run --no-sync pytest -q
  mac:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra mac --extra test
      - run: uv run --no-sync pytest -q
      - run: swift test --package-path macos --scratch-path "$RUNNER_TEMP/tapmesh-tests" --jobs 2
      - run: uv run --no-sync python scripts/setup_companion.py
      - run: uv run --no-sync python scripts/package_app.py --configuration release
      - run: uv run --no-sync python scripts/qualify_local_runtime.py --bundle "$HOME/Library/Caches/TapMesh/packages/TapMesh.app" --report "dist/ci-${{ matrix.os }}.json"
