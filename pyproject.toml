[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tapmesh"
version = "0.1.0"
description = "TapMesh owner-controlled iOS device agent and authenticated MCP coordinator"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp==2.3.0", "starlette==1.10.0", "uvicorn==0.54.0", "httpx==0.28.1",
  "jsonschema==4.26.0", "Pillow==13.0.0",
]

[project.optional-dependencies]
mac = ["fb-idb==1.7.7", "pymobiledevice3==11.50.0"]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "fb-idb==1.7.7", "pymobiledevice3==11.50.0"]

[project.scripts]
tapmesh-agent = "agent.app:main"
tapmesh-server = "server.app:main"
tapmesh-stdio = "server.stdio:main"

[tool.setuptools.packages.find]
include = ["agent*", "server*", "Contracts*", "tapmesh_runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.package-data]
Contracts = ["*.json"]
